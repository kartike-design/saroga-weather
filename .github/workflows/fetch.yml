name: Fetch weather data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Automatically limits full API historical calculations to once a day (00:00 UTC hour)
      - name: Run fetch script
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date +%H)" = "00" ]; then
            echo "Running full data sync..."
            python scripts/fetch_weather.py --full
          else
            echo "Running fast data sync..."
            python scripts/fetch_weather.py
          fi

      # Commits the clean files natively without individual external web API calls
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add docs/weather.json docs/latest.txt docs/version.txt
          
          LATEST_TS=$(cat docs/latest.txt)
          git add "docs/data_${LATEST_TS}.json"
          
          # Clean up older local data backups before pushing
          find docs/ -name "data_*.json" ! -name "data_${LATEST_TS}.json" -delete
          git add -A docs/
          
          if git diff --cached --quiet; then
            echo "No data updates detected."
          else
            git commit -m "Update weather dashboard: ${LATEST_TS}"
            git push origin main
          fi
