<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Saroga Woods — Live Weather</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Playfair Display',serif;background:#fff;color:#000;font-size:14px;line-height:1.5;}

  .header{background:#2d4a2d;color:#ffffff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .header-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#ffffff;}
  .header-right{display:flex;align-items:center;gap:10px;}
  .pws-badge{background:#3d6b3d;color:#c8e6c8;font-size:11px;padding:2px 10px;border-radius:20px;letter-spacing:0.03em;display:flex;align-items:center;gap:5px;}
  .live-dot{width:6px;height:6px;background:#7fc97f;border-radius:50%;animation:pulse 2s infinite;flex-shrink:0;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .header-updated{font-size:11px;color:#a8c5a8;}

  .body-grid{display:grid;grid-template-columns:1fr;}
  @media(min-width:560px){
    .body-grid{grid-template-columns:1fr 1fr;}
    .history-section,.facts-section,.footer{grid-column:1/-1;}
  }

  .current-section{padding:12px 14px 10px;border-bottom:1px solid #eceae4;}
  @media(min-width:560px){.current-section{padding:16px 18px 14px;border-bottom:none;border-right:1px solid #eceae4;}}

  .temp-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  @media(min-width:560px){.temp-row{gap:14px;margin-bottom:14px;}}
  .wx-icon-large img{width:52px;height:52px;display:block;}
  @media(min-width:560px){.wx-icon-large img{width:64px;height:64px;}}
  .temp-big{font-size:56px;font-weight:700;line-height:1;color:#1a2e1a;letter-spacing:-1px;}
  @media(min-width:560px){.temp-big{font-size:64px;}}
  .temp-unit{font-size:24px;font-weight:400;color:#3a3a3a;}
  .temp-feels{font-size:13px;color:#3a3a3a;margin-top:2px;font-style:italic;}
  .hilo-lbl{font-size:11px;color:#555;margin-bottom:3px;}
  .hilo{display:flex;gap:8px;margin-top:2px;}
  .hilo-item{font-size:14px;color:#000;}
  .hilo-item .arrow{font-size:12px;margin-right:2px;}
  .hilo-item .hi-arrow{color:#a05050;}
  .hilo-item .lo-arrow{color:#5080a0;}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
  .stat{background:#f7f5f0;border:1px solid #eceae4;border-radius:6px;padding:7px 8px;}
  .stat-lbl{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px;}
  .stat-val{font-size:15px;font-weight:700;color:#000;}
  .stat-sub{font-size:11px;color:#555;margin-top:1px;}

  .forecast-section{padding:12px 14px 10px;border-bottom:1px solid #eceae4;}
  @media(min-width:560px){.forecast-section{padding:16px 18px 14px;}}
  .section-label{font-size:11px;letter-spacing:0.06em;color:#555;text-transform:uppercase;margin-bottom:7px;font-weight:700;}
  .fc-list{display:flex;flex-direction:column;gap:4px;}
  .fc-row{display:grid;grid-template-columns:34px 28px 1fr auto;align-items:center;gap:6px;padding:5px 7px;background:#f7f5f0;border-radius:6px;border:1px solid #eceae4;}
  .fc-row.today{background:#2d4a2d;border-color:#2d4a2d;}
  .fc-row.today .fc-day,.fc-row.today .fc-hilo,.fc-row.today .fc-desc{color:#ffffff;}
  .fc-day{font-size:11px;font-weight:700;color:#000;letter-spacing:0.03em;}
  .fc-icon img{width:26px;height:26px;display:block;}
  .fc-desc{font-size:12px;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fc-hilo{font-size:13px;white-space:nowrap;text-align:right;}
  .fc-hilo .hi{color:#a05050;}
  .fc-hilo .lo{color:#5080a0;}
  .fc-hilo .sep{color:#bbb;margin:0 2px;}
  .fc-rain{font-size:10px;color:#4a8a6a;margin-top:1px;}

  .history-section{padding:12px 14px 12px;border-bottom:1px solid #eceae4;}
  @media(min-width:560px){.history-section{padding:14px 18px 16px;}}
  .hist-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
  .hc{background:#f7f5f0;border-radius:6px;padding:9px 11px;border:1px solid #eceae4;}
  .hc-yr{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;font-weight:700;}
  .hc-temp{font-size:22px;font-weight:700;color:#000;line-height:1;}
  .hc-avg{font-size:12px;font-weight:400;color:#555;}
  .hc-sub{font-size:12px;color:#000;}
  .hc-rain{font-size:12px;color:#4a8a6a;margin-top:2px;}

  .facts-section{padding:12px 14px 14px;border-bottom:1px solid #eceae4;background:#f7f5f0;}
  @media(min-width:560px){.facts-section{padding:14px 18px 16px;}}
  .facts-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
  @media(max-width:400px){.facts-grid{grid-template-columns:1fr;}}
  .fact-card{background:#fff;border-radius:6px;padding:9px 12px;border:1px solid #eceae4;}
  .fact-month{font-size:11px;color:#2d4a2d;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;font-weight:700;}
  .fact-item{font-size:13px;color:#000;margin-bottom:4px;line-height:1.5;}
  .fact-highlight{font-weight:700;color:#000;}

  .footer{font-size:11px;color:#888;text-align:center;padding:8px 14px 10px;border-top:1px solid #eceae4;}
  .footer a{color:#4a7a4a;text-decoration:none;}
  .error-msg{padding:20px;color:#8b6a6a;font-size:13px;text-align:center;grid-column:1/-1;}
</style>
</head>
<body>

<div class="header">
  <span class="header-title">Saroga Woods · Weather</span>
  <div class="header-right">
    <span class="pws-badge"><span class="live-dot"></span>Live · Personal Station</span>
    <span class="header-updated" id="updated">Loading…</span>
  </div>
</div>

<div class="body-grid" id="main-content">
  <div class="error-msg">Loading weather data…</div>
</div>

<div class="footer" id="footer" style="display:none;">
  Personal weather station IKUMHA3 · Saroga, Himachal Pradesh · 8,000 ft ·
  <a href="https://www.wunderground.com/dashboard/pws/IKUMHA3" target="_blank">Full history →</a>
</div>

<script>
const CDN='https://cdn.jsdelivr.net/gh/basmilius/weather-icons@dev/production/fill/svg/';
const PAGES_BASE='https://kartike-design.github.io/saroga-weather/';
const API_URL='https://api.github.com/repos/kartike-design/saroga-weather/contents/docs/weather.json?ref=data';

const WU_ICON={
  0:'clear-day',1:'clear-day',2:'clear-day',
  3:'partly-cloudy-day',4:'partly-cloudy-day',
  5:'haze',6:'partly-cloudy-day',
  7:'cloudy',8:'cloudy',9:'overcast',10:'overcast',
  11:'fog',12:'drizzle',13:'rain',14:'rain',
  15:'snow',16:'snow',17:'snow',
  18:'rain',19:'thunderstorms-rain',
  20:'snow',21:'snow',22:'snow',23:'snow',24:'snow',25:'snow',
  26:'rain',27:'thunderstorms-rain',28:'thunderstorms-rain',
  29:'thunderstorms-rain',30:'thunderstorms-rain',
  31:'clear-night',32:'clear-night',
  33:'partly-cloudy-night',34:'clear-day',
  35:'partly-cloudy-day',36:'clear-day',
  37:'thunderstorms-day',38:'thunderstorms-day',
  39:'rain',40:'rain',41:'snow',42:'snow',
  43:'snow',44:'not-available',
  45:'thunderstorms-day',46:'rain',47:'snow'
};

const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];

function icon(wu_code,size=30){
  const name=WU_ICON[wu_code]??'partly-cloudy-day';
  return `<img src="${CDN}${name}.svg" width="${size}" height="${size}" alt="" onerror="this.src='${CDN}partly-cloudy-day.svg'">`;
}
function fmt(v,u,d=0){return v==null?'—':Number(v).toFixed(d)+u;}
function shortDow(dow,i){if(i===0)return'TODAY';if(!dow)return'';return dow.substring(0,3).toUpperCase();}
function formatAge(iso){
  if(!iso)return'';
  const m=Math.round((new Date()-new Date(iso))/60000);
  if(m<2)return'Just now';
  if(m<60)return m+' min ago';
  const h=Math.floor(m/60);
  if(h<24)return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
function fmtDate(iso){
  if(!iso)return'';
  const d=new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}

let lastDataTime=null;
function tickClock(){
  if(lastDataTime)document.getElementById('updated').textContent=formatAge(lastDataTime);
}

function renderFact(f){
  if(!f)return'';
  const mName=MONTH_NAMES[(f.month||1)-1];
  let html=`<div class="fact-card">`;
  html+=`<div class="fact-month">${mName}: Weather Records</div>`;
  if(f.coldest_temp!=null&&f.coldest_date)
    html+=`<div class="fact-item">🥶 Coldest day: <span class="fact-highlight">${f.coldest_temp}°C</span> on ${fmtDate(f.coldest_date)}</div>`;
  if(f.wettest_mm!=null&&f.wettest_date)
    html+=`<div class="fact-item">🌧️ Wettest day: <span class="fact-highlight">${f.wettest_mm} mm</span> on ${fmtDate(f.wettest_date)}</div>`;
  html+=`</div>`;
  return html;
}

function render(data){
  const c=data.current||{},fc=data.forecast||[],h1=data.history_1y,h2=data.history_2y;
  const fm=data.facts_current_month,fn=data.facts_next_month;
  lastDataTime=data.generated;
  tickClock();
  document.getElementById('footer').style.display='block';
  const todayIcon=fc.length&&fc[0].icon_wu!=null?fc[0].icon_wu:2;
  let html='';

  html+=`<div class="current-section">`;
  html+=`<div class="temp-row"><div class="wx-icon-large">${icon(todayIcon,64)}</div><div>`;
  html+=`<div class="temp-big">${c.temp!=null?Math.round(c.temp):'—'}<span class="temp-unit">°C</span></div>`;
  if(c.feels_like!=null)html+=`<div class="temp-feels">Feels like ${Math.round(c.feels_like)}°C</div>`;
  html+=`<div class="hilo-lbl">Recorded today</div><div class="hilo">`;
  html+=`<div class="hilo-item"><span class="arrow hi-arrow">↑</span>${c.today_high!=null?Math.round(c.today_high)+'°':'—'}</div>`;
  html+=`<div class="hilo-item"><span class="arrow lo-arrow">↓</span>${c.today_low!=null?Math.round(c.today_low)+'°':'—'}</div>`;
  html+=`</div></div></div>`;
  html+=`<div class="stat-grid">`;
  html+=`<div class="stat"><div class="stat-lbl">Humidity</div><div class="stat-val">${fmt(c.humidity,'%')}</div></div>`;
  html+=`<div class="stat"><div class="stat-lbl">Wind</div><div class="stat-val">${c.wind_kph!=null?Math.round(c.wind_kph)+' km/h':'—'}</div>${c.wind_dir_label?`<div class="stat-sub">${c.wind_dir_label}</div>`:''}</div>`;
  html+=`<div class="stat"><div class="stat-lbl">Rain today</div><div class="stat-val">${fmt(c.precip_today,' mm',1)}</div></div>`;
  html+=`</div></div>`;

  if(fc.length){
    html+=`<div class="forecast-section"><div class="section-label">5-Day Forecast</div><div class="fc-list">`;
    fc.forEach((day,i)=>{
      const rain=day.precip>0.2?fmt(day.precip,' mm',1):'';
      const dispHigh=(i===0&&c.today_high!=null)?Math.round(c.today_high):(day.high!=null?Math.round(day.high):'—');
      const dispLow=(i===0&&c.today_low!=null)?Math.round(c.today_low):(day.low!=null?Math.round(day.low):'—');
      const rowIcon=day.icon_wu!=null?day.icon_wu:2;
      html+=`<div class="fc-row${i===0?' today':''}">`;
      html+=`<div class="fc-day">${shortDow(day.dow,i)}</div>`;
      html+=`<div class="fc-icon">${icon(rowIcon,26)}</div>`;
      html+=`<div><div class="fc-desc">${day.desc||''}</div>${rain?`<div class="fc-rain">💧 ${rain}</div>`:''}</div>`;
      html+=`<div class="fc-hilo"><span class="hi">↑${dispHigh}°</span><span class="sep">·</span><span class="lo">↓${dispLow}°</span></div>`;
      html+=`</div>`;
    });
    html+=`</div></div>`;
  }

  if(h1||h2){
    html+=`<div class="history-section"><div class="section-label">Same Week in Past Years</div><div class="hist-grid">`;
    [h1,h2].forEach(h=>{
      if(!h)return;
      html+=`<div class="hc"><div class="hc-yr">${h.year}</div>`;
      html+=`<div class="hc-temp">${h.temp_avg!=null?h.temp_avg:'—'}<span class="hc-avg">°C avg</span></div>`;
      html+=`<div class="hc-sub">↑${h.temp_high!=null?h.temp_high+'°':'—'} · ↓${h.temp_low!=null?h.temp_low+'°':'—'}</div>`;
      if(h.precip!=null)html+=`<div class="hc-rain">💧 ${h.precip} mm total</div>`;
      html+=`</div>`;
    });
    html+=`</div></div>`;
  }

  if(fm||fn){
    html+=`<div class="facts-section"><div class="section-label">Did You Know? · Weather Records at Saroga Woods</div><div class="facts-grid">`;
    html+=renderFact(fm);
    html+=renderFact(fn);
    html+=`</div></div>`;
  }

  document.getElementById('main-content').innerHTML=html;
}

async function fetchData(){
  const t=Date.now();
  try{
    // Step 1: fetch latest.txt to get current timestamp — this tiny file changes every run
    const lt=await fetch(`${PAGES_BASE}latest.txt?t=${t}`,{cache:'no-store'});
    if(lt.ok){
      const ts=(await lt.text()).trim();
      // Step 2: fetch the uniquely-named data file — never cached
      const r=await fetch(`${PAGES_BASE}data_${ts}.json`,{cache:'no-store'});
      if(r.ok){
        const data=await r.json();
        const ageMin=Math.round((new Date()-new Date(data.generated))/60000);
        if(ageMin<=25)return data;
      }
    }
  }catch(e){}
  // Fallback: GitHub API
  try{
    const r=await fetch(`${API_URL}&t=${t}`);
    if(r.ok){
      const meta=await r.json();
      return JSON.parse(atob(meta.content));
    }
  }catch(e){}
  return null;
}

async function load(){
  const data=await fetchData();
  if(data){
    render(data);
  }else{
    document.getElementById('main-content').innerHTML=
      `<div class="error-msg">Weather data temporarily unavailable · <a href="https://www.wunderground.com/dashboard/pws/IKUMHA3">View on Weather Underground →</a></div>`;
    document.getElementById('updated').textContent='';
  }
}

load();
setInterval(load,600000);
setInterval(tickClock,60000);
</script>
</body>
</html>
