<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saroga Woods — Live Weather</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', serif;
    background: #fafaf7;
    color: #2c2c2a;
    font-size: 15px;
    line-height: 1.5;
  }

  .widget {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 0 24px 0;
  }

  .header {
    background: #2d4a2d;
    color: #f0ede4;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-title { font-size: 15px; font-weight: normal; letter-spacing: 0.03em; }
  .pws-badge {
    background: #4a7c4a;
    color: #d4edda;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 20px;
    letter-spacing: 0.04em;
    font-family: 'Georgia', serif;
  }
  .live-dot {
    display: inline-block;
    width: 7px; height: 7px;
    background: #7fc97f;
    border-radius: 50%;
    margin-right: 5px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .header-updated {
    font-size: 11px;
    color: #a8c5a8;
    font-family: 'Georgia', serif;
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #6b7c6b;
    text-transform: uppercase;
    padding: 16px 20px 8px;
    font-family: 'Georgia', serif;
  }

  .current-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0;
    border-bottom: 1px solid #e8e4dc;
  }
  .temp-block {
    padding: 16px 24px 16px 20px;
    border-right: 1px solid #e8e4dc;
  }
  .temp-main {
    font-size: 52px;
    font-weight: normal;
    line-height: 1;
    color: #2d4a2d;
    font-family: 'Georgia', serif;
  }
  .temp-unit { font-size: 26px; color: #6b7c6b; }
  .feels-like { font-size: 13px; color: #6b7c6b; margin-top: 4px; }
  .minmax-row {
    display: flex;
    gap: 16px;
    margin-top: 10px;
  }
  .minmax-chip {
    background: #f0ede4;
    border-radius: 6px;
    padding: 5px 12px;
    text-align: center;
  }
  .minmax-chip .lbl { font-size: 10px; color: #6b7c6b; text-transform: uppercase; letter-spacing: 0.05em; }
  .minmax-chip .val { font-size: 16px; color: #2d4a2d; font-family: 'Georgia', serif; }

  .conditions-block {
    padding: 16px 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    align-content: center;
  }
  .cond-pill {
    background: #f0ede4;
    border-radius: 6px;
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cond-pill .lbl { font-size: 12px; color: #6b7c6b; }
  .cond-pill .val { font-size: 14px; color: #2c2c2a; font-weight: normal; }

  .forecast-row {
    display: flex;
    gap: 6px;
    padding: 4px 20px 4px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .forecast-row::-webkit-scrollbar { height: 4px; }
  .forecast-row::-webkit-scrollbar-thumb { background: #c8c4bc; border-radius: 2px; }
