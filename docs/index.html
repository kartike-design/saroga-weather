<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saroga Woods — Live Weather</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', serif;
    background: #ffffff;
    color: #3a3a3a;
    font-size: 13px;
    line-height: 1.4;
  }
  .header {
    background: #2d4a2d;
    color: #f0ede4;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }
  .header-left { display: flex; align-items: center; gap: 8px; }
  .header-title {
    font-size: 14px;
    font-weight: normal;
    letter-spacing: 0.04em;
    font-style: italic;
  }
  .pws-badge {
    background: #3d6b3d;
    color: #c8e6c8;
    font-size: 10px;
    padding: 2px 9px;
    border-radius: 20px;
    letter-spacing: 0.05em;
    font-style: normal;
  }
  .live-dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: #7fc97f;
    border-radius: 50%;
    margin-right: 4px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .header-updated { font-size: 10px; color: #a8c5a8; font-style: normal; }
  .stale-warning {
    background: #5a3a1a;
    color: #f0d9b5;
    font-size: 10px;
    text-align: center;
    padding: 4px 14px;
    display: none;
  }

  .top-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    padding: 12px 16px 10px;
    border-bottom: 1px solid #e8e4dc;
    gap: 12px;
  }
  .temp-main {
    font-size: 44px;
    font-weight: normal;
    line-height: 1;
    color: #2d4a2d;
  }
  .temp-unit { font-size: 20px; color: #7a8a7a; }
  .feels { font-size: 11px; color: #7a8a7a; margin-top: 3px; font-style: italic; }
  .minmax { display: flex; gap: 8px; }
  .mm-chip {
    background: #f5f2eb;
    border: 1px solid #e2ddd4;
    border-radius: 5px;
    padding: 5px 10px;
    text-align: center;
  }
  .mm-chip .lbl { font-size: 9px; color: #8a9a8a; text-transform: uppercase; letter-spacing: 0.06em; }
  .mm-chip .val { font-size: 15px; color: #2d4a2d; }
  .cond-pills {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
  }
  .cp {
    background: #f5f2eb;
    border: 1px solid #e2ddd4;
    border-radius: 5px;
    padding: 5px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .cp .lbl { font-size: 10px; color: #8a9a8a; white-space: nowrap; }
  .cp .val { font-size: 12px; color: #3a3a3a; }

  .section-label {
    font-size: 10px;
    letter-spacing: 0.08em;
    color: #8a9a8a;
    text-transform: uppercase;
    padding: 9px 16px 5px;
    font-style: normal;
  }
  .forecast-row {
    display: flex;
    gap: 5px;
    padding: 0 16px 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .forecast-row::-webkit-scrollbar { height: 3px; }
  .forecast-row::-webkit-scrollbar-thumb { background: #c8c4bc; border-radius: 2px; }
  .fc {
    background: #f5f2eb;
    border-radius: 6px;
    padding: 7px 8px;
    text-align: center;
    min-width: 58px;
    flex-shrink: 0;
    border: 1px solid #e2ddd4;
  }
  .fc.today { background: #2d4a2d; border-color: #2d4a2d; }
  .fc.today .fc-day,.fc.today .fc-hi,
  .fc.today .fc-lo,.fc.today .fc-rain { color: #c8e6c8; }
  .fc-day { font-size: 10px; color: #8a9a8a; letter-spacing: 0.03em; margin-bottom: 3px; }
  .fc-icon { font-size: 18px; margin: 2px 0; line-height: 1; }
  .fc-hi { font-size: 13px; color: #3a3a3a; }
  .fc-lo { font-size: 11px; color: #8a9a8a; }
  .fc-rain { font-size: 9px; color: #6a9a6a; margin-top: 2px; }

  .hist-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 0 16px 12px;
  }
  .hc {
    background: #f5f2eb;
    border-radius: 6px;
    padding: 9px 11px;
    border: 1px solid #e2ddd4;
  }
  .hc-yr { font-size: 10px; color: #8a9a8a; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
  .hc-temp { font-size: 19px; color: #2d4a2d; line-height: 1; }
  .hc-sub { font-size: 11px; color: #8a9a8a; margin-top: 3px; }

  .footer {
    font-size: 10px;
    color: #b0ad9c;
    text-align: center;
    padding: 2px 14px 10px;
    border-top: 1px solid #e8e4dc;
    padding-top: 8px;
  }
  .footer a { color: #5a7a5a; text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
  .error-msg { padding: 16px; color: #8b6a6a; font-size: 12px; text-align: center; }

  @media (max-width: 400px) {
    .top-row { grid-template-columns: auto 1fr; }
    .minmax { display: none; }
    .cond-pills { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="header-title">Saroga Woods · Weather</span>
    <span class="pws-badge"><span class="live-dot"></span>Live · Personal Station</span>
  </div>
  <span class="header-updated" id="updated">Loading…</span>
</div>
<div class="stale-warning" id="stale-warning">
  ⚠ Station data may be delayed — showing last recorded reading
</div>

<div id="main-content">
  <div class="error-msg">Loading weather data…</div>
</div>

<div class="footer">
  Personal weather station IKUMHA3 · Saroga, Himachal Pradesh · 8,000 ft ·
  <a href="https://www.wunderground.com/dashboard/pws/IKUMHA3" target="_blank">Full history →</a>
</div>

<script>
const WMO_ICON = {
  0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',
  51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',
  71:'🌨️',73:'❄️',75:'❄️',77:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',
  85:'🌨️',86:'🌨️',95:'⛈️',96:'⛈️',99:'⛈️'
};
const WMO = {
  0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',
  45:'Foggy',48:'Icy fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
  61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',
  75:'Heavy snow',77:'Snow grains',80:'Showers',81:'Showers',82:'Heavy showers',
  85:'Snow showers',86:'Heavy snow showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'
};

function fmt(v,u,d=0){ return v==null?'—':Number(v).toFixed(d)+u; }

function dayLabel(ds,i){
  if(i===0) return 'TODAY';
  const d=new Date(ds+'T00:00:00');
  return d.toLocaleDateString('en-GB',{weekday:'short'}).toUpperCase();
}

function formatUpdated(iso){
  if(!iso) return '';
  const d=new Date(iso), now=new Date();
  const m=Math.round((now-d)/60000);
  if(m<2) return 'Just now';
  if(m<60) return m+' min ago';
  const h=Math.floor(m/60);
  if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}

function checkStale(iso){
  if(!iso) return;
  const d=new Date(iso), now=new Date();
  const m=Math.round((now-d)/60000);
  if(m>30){
    document.getElementById('stale-warning').style.display='block';
  }
}

function render(data){
  const c=data.current||{}, fc=data.forecast||[], h1=data.history_1y, h2=data.history_2y;
  const timeRef = c.updated||data.generated;
  document.getElementById('updated').textContent=formatUpdated(timeRef);
  checkStale(timeRef);

  let html='';

  html+=`<div class="top-row">`;
  html+=`<div><div class="temp-main">${c.temp!=null?Math.round(c.temp):'—'}<span class="temp-unit">°C</span></div>`;
  if(c.feels_like!=null) html+=`<div class="feels">Feels like ${Math.round(c.feels_like)}°C</div>`;
  html+=`</div>`;
  html+=`<div class="cond-pills">`;
  html+=`<div class="cp"><span class="lbl">Humidity</span><span class="val">${fmt(c.humidity,'%')}</span></div>`;
  html+=`<div class="cp"><span class="lbl">Wind</span><span class="val">${c.wind_kph!=null?Math.round(c.wind_kph)+' km/h':'—'}${c.wind_dir_label?' '+c.wind_dir_label:''}</span></div>`;
  html+=`<div class="cp"><span class="lbl">Rain today</span><span class="val">${fmt(c.precip_today,' mm',1)}</span></div>`;
  html+=`</div>`;
  html+=`<div class="minmax">`;
  html+=`<div class="mm-chip"><div class="lbl">Low</div><div class="val">${c.today_low!=null?Math.round(c.today_low)+'°':'—'}</div></div>`;
  html+=`<div class="mm-chip"><div class="lbl">High</div><div class="val">${c.today_high!=null?Math.round(c.today_high)+'°':'—'}</div></div>`;
  html+=`</div>`;
  html+=`</div>`;

  if(fc.length){
    html+=`<div class="section-label">7-day forecast</div><div class="forecast-row">`;
    fc.forEach((day,i)=>{
      const rain=day.precip>0.2?fmt(day.precip,' mm',1):'';
      html+=`<div class="fc${i===0?' today':''}">`;
      html+=`<div class="fc-day">${dayLabel(day.date,i)}</div>`;
      html+=`<div class="fc-icon" title="${WMO[day.code]||''}">${WMO_ICON[day.code]||'🌡️'}</div>`;
      html+=`<div class="fc-hi">${Math.round(day.high)}°</div>`;
      html+=`<div class="fc-lo">${Math.round(day.low)}°</div>`;
      if(rain) html+=`<div class="fc-rain">${rain}</div>`;
      html+=`</div>`;
    });
    html+=`</div>`;
  }

  if(h1||h2){
    html+=`<div class="section-label">Same week in past years</div><div class="hist-row">`;
    [h1,h2].forEach(h=>{
      if(!h) return;
      html+=`<div class="hc"><div class="hc-yr">${h.year}</div>`;
      html+=`<div class="hc-temp">${h.temp_avg!=null?h.temp_avg+'°C':'—'} <span style="font-size:11px;color:#8a9a8a;">avg</span></div>`;
      html+=`<div class="hc-sub">High ${h.temp_high!=null?h.temp_high+'°':'—'} · Low ${h.temp_low!=null?h.temp_low+'°':'—'}</div>`;
      html+=`<div class="hc-sub">${h.precip!=null?h.precip+' mm rain':''}</div></div>`;
    });
    html+=`</div>`;
  }

  document.getElementById('main-content').innerHTML=html;
}

async function load(){
  try{
    const r=await fetch('https://kartike-design.github.io/saroga-weather/weather.json?t='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    render(await r.json());
  } catch(e){
    document.getElementById('main-content').innerHTML=
      `<div class="error-msg">Weather data temporarily unavailable · <a href="https://www.wunderground.com/dashboard/pws/IKUMHA3">View on Weather Underground →</a></div>`;
    document.getElementById('updated').textContent='';
  }
}
load();
setInterval(load,600000);
</script>
</body>
</html>
