<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saroga Woods — Live Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Open Sans',sans-serif;background:#fff;color:#000;font-size:14px;line-height:1.4;}

  /* ── Header ── */
  .header{background:#2a4a46;padding:11px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .header-title{font-family:'Playfair Display',serif;font-weight:700;font-style:normal;font-size:40px;color:#ffffff;line-height:1;}
  .header-right{display:flex;align-items:center;gap:10px;}
  .pws-badge{background:#3d6b67;color:#c8e6c8;font-size:10px;padding:3px 10px;border-radius:20px;letter-spacing:0.04em;font-family:'Open Sans',sans-serif;display:flex;align-items:center;gap:5px;}
  .live-dot{width:6px;height:6px;background:#7fc97f;border-radius:50%;animation:pulse 2s infinite;flex-shrink:0;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
  .header-updated{font-size:10px;color:#a8c5a8;font-family:'Open Sans',sans-serif;}

  /* ── Two-column layout on desktop ── */
  .main-grid{display:grid;grid-template-columns:1fr;}
  @media(min-width:560px){
    .main-grid{grid-template-columns:1fr 1fr;}
    .full-width{grid-column:1/-1;}
  }

  /* ── Current block ── */
  .current{padding:16px 18px 14px;border-bottom:1px solid #eceae4;}
  @media(min-width:560px){.current{border-bottom:none;border-right:1px solid #eceae4;}}
  .current-row{display:flex;align-items:center;gap:16px;margin-bottom:14px;}
  .wx-icon img{display:block;width:52px;height:52px;}
  @media(min-width:560px){.wx-icon img{width:64px;height:64px;}}
  .temp-big{font-family:'Playfair Display',serif;font-weight:700;font-size:56px;line-height:1;color:#2a4a46;letter-spacing:-2px;}
  @media(min-width:560px){.temp-big{font-size:64px;}}
  .temp-unit{font-size:26px;font-weight:400;color:#555;letter-spacing:0;}
  .temp-sub{font-size:13px;color:#555;margin-top:4px;font-family:'Open Sans',sans-serif;}
  .minmax-pills{display:flex;gap:8px;margin-top:10px;}
  .mmp{background:#f7f5f0;border:1px solid #eceae4;border-radius:6px;padding:5px 12px;text-align:center;}
  .mmp-lbl{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:0.06em;display:block;font-family:'Open Sans',sans-serif;}
  .mmp-val{font-size:16px;font-weight:600;color:#000;font-family:'Open Sans',sans-serif;}

  /* ── Stat row ── */
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:2px;}
  .stat{background:#f7f5f0;border:1px solid #eceae4;border-radius:8px;padding:9px 12px;}
  .stat-lbl{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px;font-family:'Open Sans',sans-serif;}
  .stat-val{font-size:16px;font-weight:600;color:#000;font-family:'Open Sans',sans-serif;}
  .stat-sub{font-size:11px;color:#555;margin-top:1px;font-family:'Open Sans',sans-serif;}

  /* ── Section labels ── */
  .section-label{font-family:'Playfair Display',serif;font-weight:700;font-size:13px;color:#2a4a46;padding:14px 18px 7px;letter-spacing:0.01em;}

  /* ── Forecast ── */
  .forecast-wrap{padding-bottom:12px;}
  .forecast-row{display:flex;gap:5px;padding:0 18px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .forecast-row::-webkit-scrollbar{height:3px;}
  .forecast-row::-webkit-scrollbar-thumb{background:#d0ccc4;border-radius:2px;}
  .fc{background:#f7f5f0;border-radius:8px;padding:9px 6px 8px;text-align:center;min-width:64px;flex:1;flex-shrink:0;border:1px solid #eceae4;}
  .fc.today{background:#2a4a46;border-color:#2a4a46;}
  .fc.today *{color:#c8e6c8 !important;}
  .fc-day{font-size:11px;color:#000;letter-spacing:0.04em;font-weight:600;font-family:'Open Sans',sans-serif;}
  .fc-date{font-size:10px;color:#555;font-family:'Open Sans',sans-serif;margin-bottom:3px;}
  .fc-icon img{width:28px;height:28px;margin:4px auto;display:block;}
  .fc-desc{font-size:10px;color:#555;font-family:'Open Sans',sans-serif;margin-top:2px;line-height:1.3;}
  .fc-hi{font-size:14px;font-weight:600;color:#a05050;margin-top:4px;font-family:'Open Sans',sans-serif;}
  .fc-lo{font-size:13px;font-weight:600;color:#5080a0;margin-top:1px;font-family:'Open Sans',sans-serif;}
  .fc-rain{font-size:10px;color:#4a8a6a;margin-top:3px;font-weight:600;font-family:'Open Sans',sans-serif;}

  /* ── History ── */
  .hist-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 18px 14px;}
  .hc{background:#f7f5f0;border-radius:8px;padding:12px 14px;border:1px solid #eceae4;}
  .hc-yr{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px;font-weight:600;font-family:'Open Sans',sans-serif;}
  .hc-temp{font-family:'Playfair Display',serif;font-weight:700;font-size:24px;color:#2a4a46;line-height:1;}
  .hc-avg{font-size:12px;color:#555;font-weight:400;font-family:'Open Sans',sans-serif;}
  .hc-sub{font-size:12px;color:#555;margin-top:4px;font-family:'Open Sans',sans-serif;}
  .hc-rain{font-size:12px;color:#4a8a6a;margin-top:3px;font-family:'Open Sans',sans-serif;}

  /* ── Monthly records ── */
  .facts-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 18px 14px;}
  .fact-card{background:#f7f5f0;border-radius:8px;padding:12px 14px;border:1px solid #eceae4;}
  .fact-month{font-family:'Playfair Display',serif;font-weight:700;font-size:13px;color:#2a4a46;margin-bottom:7px;}
  .fact-row{margin-bottom:3px;font-family:'Open Sans',sans-serif;font-size:13px;color:#000;line-height:1.4;}
  .fact-val{font-weight:600;color:#000;}
  .fact-date{font-size:11px;color:#555;padding-left:14px;margin-bottom:5px;font-family:'Open Sans',sans-serif;}

  /* ── Footer ── */
  .footer{font-size:11px;color:#555;text-align:center;padding:9px 18px 11px;border-top:1px solid #eceae4;font-family:'Open Sans',sans-serif;}
  .footer a{color:#2a4a46;text-decoration:none;}
  .error-msg{padding:20px;color:#555;font-size:13px;text-align:center;font-family:'Open Sans',sans-serif;}
</style>
</head>
<body>

<div class="header">
  <span class="header-title">Weather</span>
  <div class="header-right">
    <span class="pws-badge"><span class="live-dot"></span>Live · Personal Station</span>
    <span class="header-updated" id="runtime-tracker">Loading…</span>
  </div>
</div>

<div id="view-layer"><div class="error-msg">Loading weather data…</div></div>

<div class="footer">
  Personal weather station IKUMHA3 · Saroga, Himachal Pradesh · 8,000 ft ·
  <a href="https://www.wunderground.com/dashboard/pws/IKUMHA3" target="_blank">Full history →</a>
</div>

<script>
const ICON_CDN = 'https://cdn.jsdelivr.net/gh/basmilius/weather-icons@dev/production/fill/svg/';
const ICON_FALLBACK = 'partly-cloudy-day.svg';

// WU numeric code → Meteocons SVG filename
const WU_ICONS = {
  0:'thunderstorms.svg', 1:'thunderstorms.svg', 2:'hurricane.svg',
  3:'thunderstorms.svg', 4:'thunderstorms.svg', 5:'sleet.svg',
  6:'rain.svg', 7:'snow.svg', 8:'drizzle.svg', 9:'partly-cloudy-day-rain.svg',
  10:'rain.svg', 11:'drizzle.svg', 12:'rain.svg', 13:'snow.svg',
  14:'snow.svg', 15:'snow.svg', 16:'snow.svg', 17:'hail.svg',
  18:'rain.svg', 19:'dust.svg', 20:'fog.svg', 21:'haze.svg',
  22:'smoke.svg', 23:'wind.svg', 24:'wind.svg', 25:'thermometer-colder.svg',
  26:'overcast.svg', 27:'partly-cloudy-night.svg', 28:'partly-cloudy-day.svg',
  29:'partly-cloudy-night.svg', 30:'partly-cloudy-day.svg', 31:'clear-night.svg',
  32:'clear-day.svg', 33:'clear-night.svg', 34:'clear-day.svg',
  35:'thunderstorms-rain.svg', 36:'thermometer-warmer.svg',
  37:'thunderstorms.svg', 38:'thunderstorms.svg', 39:'partly-cloudy-day-rain.svg',
  40:'rain.svg', 41:'snow.svg', 42:'snow.svg', 43:'snow.svg',
  44:'thermometer.svg', 45:'partly-cloudy-night-rain.svg',
  46:'snow.svg', 47:'thunderstorms.svg'
};

function wxImg(code, size) {
  const file = WU_ICONS[code] || ICON_FALLBACK;
  const img = `<img src="${ICON_CDN}${file}" width="${size}" height="${size}" alt="" onerror="this.src='${ICON_CDN}${ICON_FALLBACK}'">`;
  return img;
}

// WU phrase → plain English
const WU_PHRASE = {
  'PM T-Storms':'Afternoon thunderstorms','AM T-Storms':'Morning thunderstorms',
  'T-Storms':'Thunderstorms','Rain Late':'Rain by evening','Rain Early':'Rain in the morning',
  'Wintry Mix':'Sleet and rain','AM Snow Showers':'Morning snow showers',
  'PM Snow Showers':'Afternoon snow showers','Blowing Snow':'Drifting snow',
  'AM Rain':'Morning rain','PM Rain':'Afternoon rain','AM Showers':'Morning showers',
  'PM Showers':'Afternoon showers','AM Clouds/PM Sun':'Cloudy morning clearing',
  'Mostly Cloudy':'Mostly cloudy','Partly Cloudy':'Partly cloudy',
  'Mostly Sunny':'Mostly sunny','Sunny':'Sunny','Clear':'Clear'
};

let dataTimestamp = null;

function tr(desc){ return WU_PHRASE[desc] || desc || ''; }

function dayLabel(dateStr, i){
  if(i===0) return 'Today';
  return new Date(dateStr+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short'});
}
function dateShort(dateStr){
  return new Date(dateStr+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function monthName(n){
  return ["January","February","March","April","May","June","July",
          "August","September","October","November","December"][n-1]||'';
}
function fmtDate(s){
  if(!s) return '—';
  return new Date(s.substring(0,10)+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}

function refreshTimeBadge(){
  if(!dataTimestamp) return;
  const d = Math.round((new Date()-new Date(dataTimestamp))/60000);
  const t = d<2?'Just now':d<60?d+'m ago':Math.floor(d/60)+'h ago';
  document.getElementById('runtime-tracker').textContent = t;
}

function processUI(payload){
  const cur = payload.current||{};
  const fc  = payload.forecast||[];
  const h1  = payload.history_1y;
  const h2  = payload.history_2y;
  const m1  = payload.facts_current_month;
  const m2  = payload.facts_next_month;

  dataTimestamp = cur.updated||payload.generated;
  refreshTimeBadge();

  const mainIcon = wxImg(fc.length ? fc[0].icon_wu : null, 64);
  const mainDesc = fc.length ? tr(fc[0].desc) : '';

  let h = '<div class="main-grid">';

  /* ── Column 1: Current ── */
  h += '<div><div class="current">';
  h += '<div class="current-row">';
  h += `<div class="wx-icon">${mainIcon}</div>`;
  h += '<div>';
  h += `<div class="temp-big">${cur.temp!=null?Math.round(cur.temp):'—'}<span class="temp-unit">°C</span></div>`;
  let sub='';
  if(cur.feels_like!=null) sub+=`Feels like ${Math.round(cur.feels_like)}°C`;
  if(mainDesc) sub+=(sub?' · ':'')+mainDesc;
  if(sub) h+=`<div class="temp-sub">${sub}</div>`;
  h+='<div class="minmax-pills">';
  h+=`<div class="mmp"><span class="mmp-lbl">Today low</span><span class="mmp-val">${cur.today_low!=null?Math.round(cur.today_low)+'°':'—'}</span></div>`;
  h+=`<div class="mmp"><span class="mmp-lbl">Today high</span><span class="mmp-val">${cur.today_high!=null?Math.round(cur.today_high)+'°':'—'}</span></div>`;
  h+='</div></div></div>';
  h+='<div class="stat-row">';
  h+=`<div class="stat"><div class="stat-lbl">Humidity</div><div class="stat-val">${cur.humidity!=null?cur.humidity+'%':'—'}</div></div>`;
  h+=`<div class="stat"><div class="stat-lbl">Wind</div><div class="stat-val">${cur.wind_kph!=null?Math.round(cur.wind_kph)+' km/h':'—'}</div>${cur.wind_dir_label?`<div class="stat-sub">${cur.wind_dir_label}</div>`:''}</div>`;
  h+=`<div class="stat"><div class="stat-lbl">Rain today</div><div class="stat-val">${cur.precip_today!=null?Number(cur.precip_today).toFixed(1)+' mm':'—'}</div></div>`;
  h+='</div></div></div>'; // end stat-row, current, col1

  /* ── Column 2: Forecast ── */
  h+='<div class="forecast-wrap">';
  if(fc.length){
    h+='<div class="section-label">5-Day Forecast</div>';
    h+='<div class="forecast-row">';
    fc.forEach((day,i)=>{
      const rain = day.precip>0.2 ? Number(day.precip).toFixed(1)+' mm' : '';
      const hi   = i===0&&cur.today_high!=null ? Math.round(cur.today_high) : Math.round(day.high);
      const desc = tr(day.desc);
      h+=`<div class="fc${i===0?' today':''}">`;
      h+=`<div class="fc-day">${dayLabel(day.date,i)}</div>`;
      h+=`<div class="fc-date">${dateShort(day.date)}</div>`;
      h+=`<div class="fc-icon">${wxImg(day.icon_wu,28)}</div>`;
      if(desc) h+=`<div class="fc-desc">${desc}</div>`;
      h+=`<div class="fc-hi">${hi}°</div>`;
      h+=`<div class="fc-lo">${Math.round(day.low)}°</div>`;
      if(rain) h+=`<div class="fc-rain">${rain}</div>`;
      h+='</div>';
    });
    h+='</div>';
  }
  h+='</div>'; // end forecast-wrap / col2

  h+='</div>'; // end main-grid

  /* ── Full-width: History ── */
  if(h1||h2){
    h+='<div class="section-label full-width">Same Week In Past Years</div>';
    h+='<div class="hist-row full-width">';
    [h1,h2].forEach(hy=>{
      if(!hy) return;
      h+=`<div class="hc"><div class="hc-yr">${hy.year}</div>`;
      h+=`<div class="hc-temp">${hy.temp_avg!=null?hy.temp_avg:'—'}<span class="hc-avg"> °C avg</span></div>`;
      h+=`<div class="hc-sub">↑ ${hy.temp_high!=null?hy.temp_high+'°':'—'} · ↓ ${hy.temp_low!=null?hy.temp_low+'°':'—'}</div>`;
      if(hy.precip!=null) h+=`<div class="hc-rain">💧 ${hy.precip} mm total rain</div>`;
      h+='</div>';
    });
    h+='</div>';
  }

  /* ── Full-width: Monthly records ── */
  if(m1||m2){
    h+='<div class="section-label full-width">Did You Know? · Weather Records At Saroga Woods</div>';
    h+='<div class="facts-row full-width">';
    [m1,m2].forEach(rec=>{
      if(!rec) return;
      h+=`<div class="fact-card"><div class="fact-month">${monthName(rec.month)}</div>`;
      h+=`<div class="fact-row">🥶 Coldest: <span class="fact-val">${rec.coldest_temp!=null?rec.coldest_temp+'°C':'—'}</span></div>`;
      h+=`<div class="fact-date">on ${fmtDate(rec.coldest_date)}</div>`;
      h+=`<div class="fact-row">💧 Wettest: <span class="fact-val">${rec.wettest_mm!=null?rec.wettest_mm+' mm':'—'}</span></div>`;
      h+=`<div class="fact-date">on ${fmtDate(rec.wettest_date)}</div>`;
      h+='</div>';
    });
    h+='</div>';
  }

  document.getElementById('view-layer').innerHTML = h;
}

async function syncFeed(){
  try{
    const r = await fetch('https://kartike-design.github.io/saroga-weather/weather.json?t='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    processUI(await r.json());
  } catch(e){
    document.getElementById('view-layer').innerHTML=
      `<div class="error-msg">Weather data temporarily unavailable · <a href="https://www.wunderground.com/dashboard/pws/IKUMHA3">View on Weather Underground →</a></div>`;
    document.getElementById('runtime-tracker').textContent='';
  }
}

syncFeed();
setInterval(syncFeed,600000);
setInterval(refreshTimeBadge,60000);
</script>
</body>
</html>
