<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saroga Woods — Live Weather</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:#2a2a2a;font-size:13px;line-height:1.4;}

  .header{background:#2d4a2d;color:#f0ede4;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .header-title{font-size:14px;font-weight:400;letter-spacing:0.03em;font-family:'Georgia',serif;font-style:italic;}
  .header-right{display:flex;align-items:center;gap:10px;}
  .pws-badge{background:#3d6b3d;color:#c8e6c8;font-size:10px;padding:2px 10px;border-radius:20px;letter-spacing:0.04em;display:flex;align-items:center;gap:5px;}
  .live-dot{width:6px;height:6px;background:#7fc97f;border-radius:50%;animation:pulse 2s infinite;flex-shrink:0;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .header-updated{font-size:10px;color:#a8c5a8;}

  .body-grid{display:grid;grid-template-columns:1fr;gap:0;}
  @media(min-width:560px){
    .body-grid{grid-template-columns:1fr 1fr;}
    .history-section{grid-column:1/-1;}
    .footer{grid-column:1/-1;}
  }

  .current-section{padding:16px 18px 14px;border-bottom:1px solid #eceae4;}
  @media(min-width:560px){.current-section{border-bottom:none;border-right:1px solid #eceae4;}}

  .temp-row{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
  .wx-icon-large img{width:64px;height:64px;display:block;}
  .temp-big{font-size:58px;font-weight:700;line-height:1;color:#1a2e1a;letter-spacing:-1px;}
  .temp-unit{font-size:26px;font-weight:400;color:#6a8a6a;}
  .temp-feels{font-size:12px;color:#7a8a7a;margin-top:3px;font-style:italic;}
  .hilo{display:flex;gap:10px;margin-top:8px;}
  .hilo-item{font-size:14px;color:#3a4a3a;}
  .hilo-item .arrow{font-size:12px;margin-right:2px;}
  .hilo-item .hi-arrow{color:#a05050;}
  .hilo-item .lo-arrow{color:#5080a0;}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .stat{background:#f7f5f0;border:1px solid #eceae4;border-radius:7px;padding:8px 10px;}
  .stat-lbl{font-size:9px;color:#8a9a8a;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:3px;}
  .stat-val{font-size:15px;font-weight:600;color:#1a2e1a;}
  .stat-sub{font-size:10px;color:#8a9a8a;margin-top:1px;}

  .forecast-section{padding:16px 18px 14px;border-bottom:1px solid #eceae4;}
  .section-label{font-size:10px;letter-spacing:0.08em;color:#8a9a8a;text-transform:uppercase;margin-bottom:8px;font-weight:500;}
  .fc-list{display:flex;flex-direction:column;gap:5px;}
  .fc-row{display:grid;grid-template-columns:36px 32px 1fr auto;align-items:center;gap:8px;padding:5px 8px;background:#f7f5f0;border-radius:7px;border:1px solid #eceae4;}
  .fc-row.today{background:#2d4a2d;border-color:#2d4a2d;}
  .fc-row.today .fc-day,.fc-row.today .fc-hilo{color:#c8e6c8;}
  .fc-day{font-size:11px;font-weight:500;color:#5a6a5a;letter-spacing:0.04em;}
  .fc-icon img{width:30px;height:30px;display:block;}
  .fc-desc{font-size:11px;color:#6a7a6a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fc-hilo{font-size:12px;color:#2a3a2a;white-space:nowrap;text-align:right;}
  .fc-hilo .hi{color:#a05050;}
  .fc-hilo .lo{color:#5080a0;}
  .fc-hilo .sep{color:#c0c8c0;margin:0 3px;}
  .fc-rain{font-size:10px;color:#4a8a6a;margin-top:1px;}

  .history-section{padding:14px 18px 16px;border-bottom:1px solid #eceae4;}
  .hist-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
  .hc{background:#f7f5f0;border-radius:7px;padding:10px 13px;border:1px solid #eceae4;}
  .hc-yr{font-size:10px;color:#8a9a8a;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px;font-weight:500;}
  .hc-temp{font-size:21px;font-weight:700;color:#1a2e1a;line-height:1;}
  .hc-avg{font-size:11px;font-weight:400;color:#8a9a8a;}
  .hc-sub{font-size:11px;color:#6a7a6a;margin-top:4px;}
  .hc-rain{font-size:11px;color:#4a8a6a;margin-top:2px;}

  .footer{font-size:10px;color:#b0ad9c;text-align:center;padding:8px 18px 10px;border-top:1px solid #eceae4;}
  .footer a{color:#4a7a4a;text-decoration:none;}
  .error-msg{padding:20px;color:#8b6a6a;font-size:12px;text-align:center;grid-column:1/-1;}
</style>
</head>
<body>

<div class="header">
  <span class="header-title">Saroga Woods · Weather</span>
  <div class="header-right">
    <span class="pws-badge"><span class="live-dot"></span>Live · Personal Station</span>
    <span class="header-updated" id="updated">Loading…</span>
  </div>
</div>

<div class="body-grid" id="main-content">
  <div class="error-msg">Loading weather data…</div>
</div>

<div class="footer" id="footer" style="display:none;">
  Personal weather station IKUMHA3 · Saroga, Himachal Pradesh · 8,000 ft ·
  <a href="https://www.wunderground.com/dashboard/pws/IKUMHA3" target="_blank">Full history →</a>
</div>

<script>
const CDN='https://cdn.jsdelivr.net/gh/basmilius/weather-icons@dev/production/fill/svg/';

const WMO_ICON={
  0:'clear-day',1:'partly-cloudy-day',2:'partly-cloudy-day',3:'overcast',
  45:'fog',48:'fog',
  51:'drizzle',53:'drizzle',55:'drizzle',
  61:'rain',63:'rain',65:'rain',
  71:'snow',73:'snow',75:'snow',77:'snow',
  80:'rain',81:'rain',82:'thunderstorms-rain',
  85:'snow',86:'snow',
  95:'thunderstorms',96:'thunderstorms',99:'thunderstorms'
};

const WMO_DESC={
  0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',
  45:'Foggy',48:'Icy fog',
  51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
  61:'Light rain',63:'Rain',65:'Heavy rain',
  71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',
  80:'Rain showers',81:'Rain showers',82:'Violent showers',
  85:'Snow showers',86:'Heavy snow showers',
  95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'
};

function icon(code,size=30){
  const name=WMO_ICON[code]||'not-available';
  return `<img src="${CDN}${name}.svg" width="${size}" height="${size}" alt="${WMO_DESC[code]||''}" onerror="this.style.display='none'">`;
}

function fmt(v,u,d=0){return v==null?'—':Number(v).toFixed(d)+u;}

function dayLabel(ds,i){
  if(i===0)return'TODAY';
  const d=new Date(ds+'T00:00:00');
  return d.toLocaleDateString('en-GB',{weekday:'short'}).toUpperCase();
}

function formatAge(iso){
  if(!iso)return'';
  const m=Math.round((new Date()-new Date(iso))/60000);
  if(m<2)return'Just now';
  if(m<60)return m+' min ago';
  const h=Math.floor(m/60);
  if(h<24)return h+'h ago';
  return Math.floor(h/24)+'d ago';
}

let lastDataTime=null;
function tickClock(){
  if(lastDataTime) document.getElementById('updated').textContent=formatAge(lastDataTime);
}

function render(data){
  const c=data.current||{}, fc=data.forecast||[], h1=data.history_1y, h2=data.history_2y;
  lastDataTime=data.generated;
  tickClock();
  document.getElementById('footer').style.display='block';

  const todayCode=fc.length?fc[0].code:null;
  let html='';

  html+=`<div class="current-section">`;
  html+=`<div class="temp-row">`;
  html+=`<div class="wx-icon-large">${icon(todayCode,64)}</div>`;
  html+=`<div>`;
  html+=`<div class="temp-big">${c.temp!=null?Math.round(c.temp):'—'}<span class="temp-unit">°C</span></div>`;
  if(c.feels_like!=null) html+=`<div class="temp-feels">Feels like ${Math.round(c.feels_like)}°C</div>`;
  html+=`<div class="hilo">`;
  html+=`<div class="hilo-item"><span class="arrow hi-arrow">↑</span>${c.today_high!=null?Math.round(c.today_high)+'°':'—'}</div>`;
  html+=`<div class="hilo-item"><span class="arrow lo-arrow">↓</span>${c.today_low!=null?Math.round(c.today_low)+'°':'—'}</div>`;
  html+=`</div></div></div>`;

  html+=`<div class="stat-grid">`;
  html+=`<div class="stat"><div class="stat-lbl">Humidity</div><div class="stat-val">${fmt(c.humidity,'%')}</div></div>`;
  html+=`<div class="stat"><div class="stat-lbl">Wind</div><div class="stat-val">${c.wind_kph!=null?Math.round(c.wind_kph)+' km/h':'—'}</div>${c.wind_dir_label?`<div class="stat-sub">${c.wind_dir_label}</div>`:''}</div>`;
  html+=`<div class="stat"><div class="stat-lbl">Rain today</div><div class="stat-val">${fmt(c.precip_today,' mm',1)}</div></div>`;
  html+=`</div></div>`;

  html+=`<div class="forecast-section">`;
  html+=`<div class="section-label">7-day forecast</div>`;
  html+=`<div class="fc-list">`;
  fc.forEach((day,i)=>{
    const rain=day.precip>0.2?fmt(day.precip,' mm',1):'';
    html+=`<div class="fc-row${i===0?' today':''}">`;
    html+=`<div class="fc-day">${dayLabel(day.date,i)}</div>`;
    html+=`<div class="fc-icon">${icon(day.code,30)}</div>`;
    html+=`<div><div class="fc-desc">${WMO_DESC[day.code]||''}</div>${rain?`<div class="fc-rain">💧 ${rain}</div>`:''}</div>`;
    html+=`<div class="fc-hilo"><span class="hi">↑${Math.round(day.high)}°</span><span class="sep">·</span><span class="lo">↓${Math.round(day.low)}°</span></div>`;
    html+=`</div>`;
  });
  html+=`</div></div>`;

  if(h1||h2){
    html+=`<div class="history-section">`;
    html+=`<div class="section-label">Same week in past years</div>`;
    html+=`<div class="hist-grid">`;
    [h1,h2].forEach(h=>{
      if(!h)return;
      html+=`<div class="hc"><div class="hc-yr">${h.year}</div>`;
      html+=`<div class="hc-temp">${h.temp_avg!=null?h.temp_avg:'—'}<span class="hc-avg">°C avg</span></div>`;
      html+=`<div class="hc-sub">↑${h.temp_high!=null?h.temp_high+'°':'—'} · ↓${h.temp_low!=null?h.temp_low+'°':'—'}</div>`;
      if(h.precip!=null) html+=`<div class="hc-rain">💧 ${h.precip} mm total</div>`;
      html+=`</div>`;
    });
    html+=`</div></div>`;
  }

  document.getElementById('main-content').innerHTML=html;
}

async function load(){
  try{
    const r=await fetch('https://raw.githubusercontent.com/kartike-design/saroga-weather/data/docs/weather.json?t='+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    render(await r.json());
  }catch(e){
    document.getElementById('main-content').innerHTML=
      `<div class="error-msg">Weather data temporarily unavailable · <a href="https://www.wunderground.com/dashboard/pws/IKUMHA3">View on Weather Underground →</a></div>`;
    document.getElementById('updated').textContent='';
  }
}

load();
setInterval(load,600000);
setInterval(tickClock,60000);
</script>
</body>
</html>
