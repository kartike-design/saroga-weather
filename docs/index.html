<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saroga Woods — Live Weather</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:#1a1a1a;font-size:13px;line-height:1.4;}

  .header{background:#2d4a2d;color:#f0ede4;padding:11px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;}
  .header-title{font-size:14px;font-weight:400;letter-spacing:0.03em;font-family:'Georgia',serif;font-style:italic;}
  .header-right{display:flex;align-items:center;gap:10px;}
  .pws-badge{background:#3d6b3d;color:#c8e6c8;font-size:10px;padding:2px 9px;border-radius:20px;letter-spacing:0.04em;display:flex;align-items:center;gap:4px;}
  .live-dot{width:6px;height:6px;background:#7fc97f;border-radius:50%;animation:pulse 2s infinite;flex-shrink:0;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
  .header-updated{font-size:10px;color:#a8c5a8;}

  /* Current block */
  .current{padding:16px 18px 14px;border-bottom:1px solid #eceae4;}
  .current-row{display:flex;align-items:center;gap:20px;margin-bottom:14px;}
  .wx-icon{font-size:52px;line-height:1;flex-shrink:0;}
  .temp-block{}
  .temp-big{font-size:62px;font-weight:700;line-height:1;color:#1a2e1a;letter-spacing:-2px;}
  .temp-unit{font-size:28px;font-weight:400;color:#6a7a6a;letter-spacing:0;}
  .temp-sub{font-size:12px;color:#7a8a7a;margin-top:4px;}
  .minmax-pills{display:flex;gap:8px;margin-top:8px;}
  .mmp{background:#f2f0ea;border:1px solid #e2ddd4;border-radius:6px;padding:5px 12px;text-align:center;}
  .mmp-lbl{font-size:9px;color:#8a9a8a;text-transform:uppercase;letter-spacing:0.07em;display:block;}
  .mmp-val{font-size:16px;font-weight:600;color:#1a2e1a;}

  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
  .stat{background:#f7f5f0;border:1px solid #eceae4;border-radius:8px;padding:9px 12px;}
  .stat-lbl{font-size:9px;color:#8a9a8a;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:3px;}
  .stat-val{font-size:16px;font-weight:600;color:#1a2e1a;}
  .stat-sub{font-size:10px;color:#8a9a8a;margin-top:1px;}

  /* Forecast */
  .section-label{font-size:10px;letter-spacing:0.08em;color:#8a9a8a;text-transform:uppercase;padding:12px 18px 6px;font-weight:500;}
  .forecast-row{display:flex;gap:5px;padding:0 18px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .forecast-row::-webkit-scrollbar{height:3px;}
  .forecast-row::-webkit-scrollbar-thumb{background:#d0ccc4;border-radius:2px;}
  .fc{background:#f7f5f0;border-radius:8px;padding:9px 7px 8px;text-align:center;min-width:62px;flex:1;flex-shrink:0;border:1px solid #eceae4;transition:background 0.15s;}
  .fc.today{background:#2d4a2d;border-color:#2d4a2d;}
  .fc.today .fc-day,.fc.today .fc-hi,.fc.today .fc-lo,.fc.today .fc-rain{color:#c8e6c8;}
  .fc-day{font-size:10px;color:#8a9a8a;letter-spacing:0.04em;margin-bottom:4px;font-weight:500;}
  .fc-icon{font-size:22px;margin:3px 0;line-height:1;}
  .fc-hi{font-size:14px;font-weight:700;color:#1a1a1a;margin-top:3px;}
  .fc-lo{font-size:12px;color:#8a9a8a;margin-top:1px;}
  .fc-rain{font-size:9px;color:#4a8a6a;margin-top:3px;font-weight:500;}

  /* History */
  .hist-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 18px 14px;}
  .hc{background:#f7f5f0;border-radius:8px;padding:10px 13px;border:1px solid #eceae4;}
  .hc-yr{font-size:10px;color:#8a9a8a;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px;font-weight:500;}
  .hc-temp{font-size:22px;font-weight:700;color:#1a2e1a;line-height:1;}
  .hc-avg{font-size:11px;color:#8a9a8a;font-weight:400;}
  .hc-sub{font-size:11px;color:#6a7a6a;margin-top:4px;}
  .hc-rain{font-size:11px;color:#4a8a6a;margin-top:2px;}

  .footer{font-size:10px;color:#b0ad9c;text-align:center;padding:8px 18px 10px;border-top:1px solid #eceae4;}
  .footer a{color:#4a7a4a;text-decoration:none;}
  .error-msg{padding:20px;color:#8b6a6a;font-size:12px;text-align:center;}
</style>
</head>
<body>

<div class="header">
  <span class="header-title">Saroga Woods · Weather</span>
  <div class="header-right">
    <span class="pws-badge"><span class="live-dot"></span>Live · Personal Station</span>
    <span class="header-updated" id="updated">Loading…</span>
  </div>
</div>

<div id="main-content"><div class="error-msg">Loading weather data…</div></div>

<div class="footer">
  Personal weather station IKUMHA3 · Saroga, Himachal Pradesh · 8,000 ft ·
  <a href="https://www.wunderground.com/dashboard/pws/IKUMHA3" target="_blank">Full history →</a>
</div>

<script>
const WMO_ICON={
  0:'☀️',1:'🌤️',2:'⛅',3:'☁️',
  45:'🌫️',48:'🌫️',
  51:'🌦️',53:'🌦️',55:'🌧️',
  61:'🌧️',63:'🌧️',65:'🌧️',
  71:'🌨️',73:'❄️',75:'❄️',77:'❄️',
  80:'🌦️',81:'🌧️',82:'⛈️',
  85:'🌨️',86:'🌨️',
  95:'⛈️',96:'⛈️',99:'⛈️'
};
const WMO={
  0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',
  45:'Foggy',48:'Icy fog',
  51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
  61:'Light rain',63:'Rain',65:'Heavy rain',
  71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',
  80:'Rain showers',81:'Rain showers',82:'Violent showers',
  85:'Snow showers',86:'Heavy snow showers',
  95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'
};

let lastDataTime=null;

function fmt(v,u,d=0){return v==null?'—':Number(v).toFixed(d)+u;}

function dayLabel(ds,i){
  if(i===0)return'TODAY';
  const d=new Date(ds+'T00:00:00');
  return d.toLocaleDateString('en-GB',{weekday:'short'}).toUpperCase();
}

function formatAge(iso){
  if(!iso)return'';
  const m=Math.round((new Date()-new Date(iso))/60000);
  if(m<2)return'Just now';
  if(m<60)return m+' min ago';
  const h=Math.floor(m/60);
  if(h<24)return h+'h ago';
  return Math.floor(h/24)+'d ago';
}

function tickClock(){
  if(lastDataTime) document.getElementById('updated').textContent=formatAge(lastDataTime);
}

function render(data){
  const c=data.current||{},fc=data.forecast||[],h1=data.history_1y,h2=data.history_2y;
  lastDataTime=c.updated||data.generated;
  tickClock();

  // Pick icon from today's forecast code if available
  const todayCode=fc.length?fc[0].code:null;
  const wxIcon=WMO_ICON[todayCode]||'🌡️';
  const wxDesc=WMO[todayCode]||'';

  let html='';

  /* ── Current ── */
  html+=`<div class="current">`;
  html+=`<div class="current-row">`;
  html+=`<div class="wx-icon" title="${wxDesc}">${wxIcon}</div>`;
  html+=`<div class="temp-block">`;
  html+=`<div class="temp-big">${c.temp!=null?Math.round(c.temp):'—'}<span class="temp-unit">°C</span></div>`;
  let sub='';
  if(c.feels_like!=null) sub+=`Feels like ${Math.round(c.feels_like)}°C`;
  if(wxDesc) sub+=(sub?' · ':'')+wxDesc;
  if(sub) html+=`<div class="temp-sub">${sub}</div>`;
  html+=`<div class="minmax-pills">`;
  html+=`<div class="mmp"><span class="mmp-lbl">Today low</span><span class="mmp-val">${c.today_low!=null?Math.round(c.today_low)+'°':'—'}</span></div>`;
  html+=`<div class="mmp"><span class="mmp-lbl">Today high</span><span class="mmp-val">${c.today_high!=null?Math.round(c.today_high)+'°':'—'}</span></div>`;
  html+=`</div>`;
  html+=`</div></div>`;

  html+=`<div class="stat-row">`;
  html+=`<div class="stat"><div class="stat-lbl">Humidity</div><div class="stat-val">${fmt(c.humidity,'%')}</div></div>`;
  html+=`<div class="stat"><div class="stat-lbl">Wind</div><div class="stat-val">${c.wind_kph!=null?Math.round(c.wind_kph)+' km/h':'—'}</div>${c.wind_dir_label?`<div class="stat-sub">${c.wind_dir_label}</div>`:''}</div>`;
  html+=`<div class="stat"><div class="stat-lbl">Rain today</div><div class="stat-val">${fmt(c.precip_today,' mm',1)}</div></div>`;
  html+=`</div>`;
  html+=`</div>`;

  /* ── Forecast ── */
  if(fc.length){
    html+=`<div class="section-label">7-day forecast</div><div class="forecast-row">`;
    fc.forEach((day,i)=>{
      const rain=day.precip>0.2?fmt(day.precip,' mm',1):'';
      html+=`<div class="fc${i===0?' today':''}">`;
      html+=`<div class="fc-day">${dayLabel(day.date,i)}</div>`;
      html+=`<div class="fc-icon" title="${WMO[day.code]||''}">${WMO_ICON[day.code]||'🌡️'}</div>`;
      html+=`<div class="fc-hi">${Math.round(day.high)}°</div>`;
      html+=`<div class="fc-lo">${Math.round(day.low)}°</div>`;
      if(rain)html+=`<div class="fc-rain">${rain}</div>`;
      html+=`</div>`;
    });
    html+=`</div>`;
  }

  /* ── History ── */
  if(h1||h2){
    html+=`<div class="section-label">Same week in past years</div><div class="hist-row">`;
    [h1,h2].forEach(h=>{
      if(!h)return;
      html+=`<div class="hc">`;
      html+=`<div class="hc-yr">${h.year}</div>`;
      html+=`<div class="hc-temp">${h.temp_avg!=null?h.temp_avg:'—'}<span class="hc-avg">°C avg</span></div>`;
      html+=`<div class="hc-sub">↑ ${h.temp_high!=null?h.temp_high+'°':'—'} · ↓ ${h.temp_low!=null?h.temp_low+'°':'—'}</div>`;
      if(h.precip!=null)html+=`<div class="hc-rain">💧 ${h.precip} mm total rain</div>`;
      html+=`</div>`;
    });
    html+=`</div>`;
  }

  document.getElementById('main-content').innerHTML=html;
}

async function load(){
  try{
    const r=await fetch('https://kartike-design.github.io/saroga-weather/weather.json?t='+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    render(await r.json());
  }catch(e){
    document.getElementById('main-content').innerHTML=
      `<div class="error-msg">Weather data temporarily unavailable · <a href="https://www.wunderground.com/dashboard/pws/IKUMHA3">View on Weather Underground →</a></div>`;
    document.getElementById('updated').textContent='';
  }
}

load();
setInterval(load,600000);
setInterval(tickClock,60000);
</script>
</body>
</html>
